
<div class="container">

  <h1>Rainbow Text Simulator</h1>

  <p class="description">
    Écris quelque chose dans le champ ci-dessous
    et observe les changements de couleurs !
  </p>

  <div class="input-container">

    <label for="rainbowInput">
      Ton texte :
    </label>

    <input
      id="rainbowInput"
      type="text"
      appRainbow
      placeholder="Commence à écrire..."
    >

  </div>

  <div class="information">
    <p> Chaque frappe génère une nouvelle couleur.</p>
    <p>La couleur du texte et de la bordure changent simultanément.</p>
  </div>

</div>
