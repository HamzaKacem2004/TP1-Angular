<div class="container">

  <h2>Color Changer</h2>

  <input
    type="text"
    #colorInput
    placeholder="Enter a color (red, blue...)"
    (input)="changeColor(colorInput.value)"
  >

  <button (click)="resetColor()">
    Reset Color
  </button>

  <div
    class="color-box"
    [style.backgroundColor]="currentColor">
  </div>

</div>
